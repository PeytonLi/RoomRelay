name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: roomrelay
          POSTGRES_PASSWORD: roomrelay-dev
          POSTGRES_DB: roomrelay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U roomrelay -d roomrelay"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://roomrelay:roomrelay-dev@localhost:5432/roomrelay
      CI: true

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: node scripts/fetch-fixtures.mjs

      - run: pnpm --filter @roomrelay/web exec prisma migrate deploy

      - run: pnpm -r typecheck

      - run: pnpm -r test

      - run: pnpm --filter @roomrelay/web exec next build

      - run: pnpm --filter @roomrelay/web exec playwright install --with-deps chromium

      - run: pnpm --filter @roomrelay/web test:e2e
        working-directory: apps/web

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
