name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: roomrelay
          POSTGRES_PASSWORD: roomrelay-dev
          POSTGRES_DB: roomrelay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U roomrelay -d roomrelay"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://roomrelay:roomrelay-dev@localhost:5432/roomrelay
      CI: true

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: node scripts/fetch-fixtures.mjs

      - run: pnpm --filter @roomrelay/web exec prisma migrate deploy

      - run: pnpm -r typecheck

      - run: pnpm lint

      # DB integration suites share one Postgres database and TRUNCATE the
      # shared jobs table, so workspace tests must run serially.
      - run: pnpm -r --workspace-concurrency=1 test

      - run: pnpm --filter @roomrelay/web exec next build

      - run: pnpm --filter @roomrelay/web exec playwright install --with-deps chromium

      - run: pnpm --filter @roomrelay/web test:e2e
        working-directory: apps/web

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0"
      - run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: |
            apps/android/app/build/reports/
            apps/android/app/build/test-results/
          retention-days: 7
